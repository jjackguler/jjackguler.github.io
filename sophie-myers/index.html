<style>
:root{--bg:#0d1828;--panel:#15243a;--line:#24364f;--ink:#eef3f8;--ink-2:#9db0c6;--ice:#a8d5ff;--amber:#f3aa3c;--amber-ink:#1c1304;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Helvetica Neue","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:14px}
.orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e4f2ff,var(--ice));box-shadow:0 0 0 10px rgba(168,213,255,.08)}
h1{margin:4px 0 0;font-size:24px;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2);font-size:15px}
label{font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;min-height:48px;background:var(--amber);color:var(--amber-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);min-height:1.5em;font-size:14px}
.small{font-size:13px}
</style>

<script>
(function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  function bytes(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function open(code) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.s), iterations: P.i, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.n) }, key, bytes(P.d));
    var html = new TextDecoder().decode(out);
    try { sessionStorage.setItem("sophie-code", code); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  var f = document.getElementById("f"), go = document.getElementById("go"), err = document.getElementById("err");
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    go.disabled = true; err.textContent = "";
    open(document.getElementById("code").value.trim()).catch(function () {
      go.disabled = false;
      err.textContent = "That code didn't work. Check it and try again. · Code incorrect, veuillez réessayer.";
    });
  });
  var saved = null;
  try { saved = sessionStorage.getItem("sophie-code"); } catch (e) {}
  if (saved) open(saved).catch(function () {});
})();
</script>
